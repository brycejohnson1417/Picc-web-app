name: daily-briefing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled briefing delivery
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 2
          --header "Authorization: Bearer ${CRON_SECRET}"
          https://piccnewyork.org/api/cron/daily-briefing
